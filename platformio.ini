; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv

lib_deps =
    bblanchon/ArduinoJson @ 6.21.3
    framework-arduinoespressif8266
    framework-arduino-mocks
    knolleary/PubSubClient@^2.8
    mikalhart/TinyGPSPlus@^1.0.3

[env:wemos_d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = 192.168.4.1  ; AP IP address
monitor_speed = 115200
upload_speed = 230400


; Native host tests: pure logic only (VoltageSensor, AlternatorLogic).
; Runs on your machine, no ESP8266 board needed: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -DUNITY_INCLUDE_DOUBLE
build_src_filter =
    +<charging/VoltageSensor.cpp>
    +<charging/AlternatorLogic.cpp>
    +<charging/PidAutotuner.cpp>
    +<charging/RealTimePid.cpp>
    +<charging/EngineDetector.cpp>
    +<charging/PwmMirror.cpp>
    +<charging/StatusLed.cpp>
    +<charging/EngineMode.cpp>
    +<gps/GpsJumpFilter.cpp>
    +<gps/SpeedAverager.cpp>
    +<connectivity/MqttPublisher.cpp>
    +<storage/UsageCounters.cpp>
    +<storage/MaintenanceLog.cpp>

; Same as env:native, instrumented for coverage: `pio test -e coverage`, then see
; scripts/coverage.sh (or the CI workflow) to turn the .profraw into a report.
[env:coverage]
extends = env:native
build_flags = --coverage
extra_scripts = pre:scripts/coverage_link_flags.py